[package]
name = "windowkeeper"
version = "0.1.0"
edition = "2021"
authors = ["Strugglechen1337"]
description = "Portable Windows-Tray-App, die Fensterpositionen speichert und wiederherstellt"
repository = "https://github.com/Strugglechen1337/WindowKeeper"
license = "MIT"
readme = "README.md"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

# Optional: build the GUI on Linux/macOS to render the documentation
# screenshots (`cargo run --example export_screenshots --features screenshots`).
# Never needed on Windows (the entries below are always on there).
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "x11"] }
winit = { version = "0.30", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
screenshots = ["dep:eframe", "dep:winit", "dep:image"]

[[example]]
name = "export_screenshots"
required-features = ["screenshots"]

[target.'cfg(windows)'.dependencies]
# GUI: egui on the OpenGL (glow) backend. The `winit` entry only unifies the
# version eframe uses; it is needed to run the event loop off the main thread.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
